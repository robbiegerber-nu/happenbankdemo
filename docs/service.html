<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service & Access Operations · Happen Bank Contact Center (demo)</title>
<meta name="description" content="Simulated service level, waits, abandons, forecast and staffing by queue and interval, for demonstration only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=1.3">
<script src="assets/site.js?v=2.6"></script>
<script src="assets/service.js?v=1.0"></script>
<style>
  main.wrap { padding-top: 28px; }
  .sub { margin: 6px 0 0; color: var(--text-muted); font-size: 14px; }
  .note { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  .card { margin-top: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; min-height: 44px; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--brand-blue); }
  .ctls { display: contents; }
  @media (min-width: 768px) { .filter-bar .wrap { gap: 8px; } .ctls .filter { gap: 5px; } .ctls select { max-width: 168px; } #f-days { max-width: 118px; } #f-end { max-width: 206px; } #f-channel { max-width: 120px; } #f-dow { max-width: 142px; } }
  .phone-f { display: none; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chips:empty { display: none; }
  .chip { border: 1px solid var(--control); border-radius: 999px; background: var(--surface); padding: 6px 12px; font-size: 13px; min-height: 36px; cursor: pointer; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 18px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; cursor: pointer; }
  .tile:hover { border-color: var(--text-muted); }
  .tile.sel { border-color: var(--brand-blue); box-shadow: 0 0 0 1px var(--brand-blue); }
  .tile-top { display: flex; justify-content: space-between; gap: 6px; }
  .tile-top button.t { all: unset; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-primary); min-height: 24px; }
  .tile-top button.t:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 3px; border-radius: 4px; }
  .tile .v { font-size: 27px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; line-height: 1.2; }
  .tile .m { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .tile .chg { display: block; margin-top: 4px; white-space: normal; }
  .chart { margin-top: 10px; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .x { overflow-x: auto; }
  .legend { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-muted); margin-top: 8px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .tbl { overflow: auto; margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; max-height: 520px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 600; background: var(--surface-warm); position: sticky; top: 0; z-index: 1; }
  td.low { color: var(--text-muted); }
  tr.sel td { box-shadow: inset 0 2px 0 var(--brand-blue), inset 0 -2px 0 var(--brand-blue); }
  tr.faded td, tr.faded .name { color: var(--text-muted); font-weight: 400; }
  .name { border: 0; background: none; padding: 4px 0; min-height: 28px; cursor: pointer; color: var(--text-primary); font-weight: 600; text-align: left; }
  .name:hover { color: var(--brand-blue); }
  h3 { margin-top: 20px; }
  .ax text { fill: var(--text-muted); font-size: 12px; font-family: var(--font); }
  .g line { stroke: var(--grid); }
  .l1 { fill: none; stroke: var(--brand-blue); stroke-width: 2; stroke-linejoin: round; } .l2 { fill: none; stroke: var(--text-primary); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .pt { fill: var(--brand-blue); stroke: var(--surface); stroke-width: 1.5; } .pt.low { fill: var(--surface); stroke: var(--text-muted); } .pt.day { stroke: var(--text-primary); stroke-width: 2; }
  .tg { stroke: var(--text-primary); stroke-opacity: .7; stroke-width: 1.5; stroke-dasharray: 5 4; } .wb { fill: var(--watch-wash); fill-opacity: var(--wash-op); }
  .evb { fill: var(--event); fill-opacity: .12; } .evl { stroke: var(--event); stroke-opacity: .6; }
  .ev circle { fill: var(--surface); stroke: var(--event); } .ev text { fill: var(--text-muted); font-size: 10px; font-weight: 700; text-anchor: middle; font-family: var(--font); }
  .lab { fill: var(--text-secondary); font-size: 12px; font-family: var(--font); }
  .hit { fill: transparent; cursor: pointer; }
  .hit:focus-visible, .hm:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 2px; }
  .cell { fill: var(--brand-blue); } .cell0 { fill: var(--surface-warm); } .cell-low { fill: none; stroke: var(--grid); }
  .cell-sel { fill: none; stroke: var(--text-primary); stroke-width: 2.5; } .cell-cur { fill: none; stroke: var(--off-ink); stroke-width: 2; }
  .dow { fill: var(--text-secondary); font-size: 12.5px; font-family: var(--font); cursor: pointer; } .dow.sel { font-weight: 700; fill: var(--brand-blue); }
  .gap { fill: var(--off-wash); fill-opacity: .18; }
  @media (max-width: 767px) {
    .phone-f { display: inline-flex; align-items: center; }
    .ctls { display: none; flex-basis: 100%; flex-direction: column; gap: 8px; }
    .ctls.open { display: flex; }
    .ctls .filter { flex: none; }
    .ctls .filter .flabel { position: static; width: auto; height: auto; clip: auto; min-width: 90px; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .card { padding: 14px; }
    .tile .v { font-size: 22px; }
    .name, .chip { min-height: 44px; }
  }
</style>
</head>
<body>
<div class="filter-bar" role="region" aria-label="Filters"><div class="wrap">
  <button class="btn phone-f" id="phone-f" type="button" aria-expanded="false" aria-controls="ctls">Filters</button>
  <div class="ctls" id="ctls">
    <label class="filter"><span class="flabel">Period</span><select id="f-days"><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></label>
    <label class="filter"><span class="flabel">Ending</span><select id="f-end"></select></label>
    <label class="filter"><span class="flabel">Channel</span><select id="f-channel"></select></label>
    <label class="filter"><span class="flabel">Queue</span><select id="f-queue"></select></label>
    <label class="filter"><span class="flabel">Day</span><select id="f-dow"></select></label>
    <button class="link-btn" id="f-reset" type="button">Reset to default</button>
  </div>
  <span class="spacer"></span><button class="btn" id="copy-link" type="button">Copy link</button>
</div></div>
<main class="wrap" id="main">
  <h1>Service & access operations</h1>
  <p class="sub" id="s-page"></p>
  <div class="chips" id="chips"></div>
  <p class="note" id="loading">Loading service data…</p>
  <div id="content" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="sr-only" id="live" aria-live="polite"></div>
    <section class="card" aria-labelledby="t-day">
      <div class="head"><div><h2 id="t-day"></h2><div class="sub" id="s-day"></div></div><div class="tools"><label class="toggle"><input type="checkbox" id="t-events" checked> Show events</label><button class="btn" id="csv-day" type="button" hidden>Download CSV</button><button class="btn" id="tb-day" type="button">View as table</button></div></div>
      <div class="chart" id="c-day"></div><div class="legend" id="lg-day"></div><div class="tbl" id="tbl-day" tabindex="0" role="region" aria-label="Values by day" hidden></div>
    </section>
    <section class="card" aria-labelledby="t-heat">
      <div class="head"><div><h2 id="t-heat"></h2><div class="sub" id="s-heat"></div></div></div>
      <div class="chart x" id="c-heat" role="group"></div><div class="legend" id="lg-heat"></div>
      <div class="head"><h3 id="t-worst"></h3><div class="tools"><button class="btn" id="csv-worst" type="button">Download CSV</button></div></div>
      <div class="tbl" id="tbl-worst"></div><p class="note" id="n-worst"></p>
    </section>
    <section class="card" aria-labelledby="t-prof">
      <div class="head"><div><h2 id="t-prof"></h2><div class="sub" id="s-prof"></div></div><div class="tools"><button class="btn" id="csv-prof" type="button" hidden>Download CSV</button><button class="btn" id="tb-prof" type="button">View as table</button></div></div>
      <div id="prof-charts"><h3>Contacts per interval</h3><div class="chart" id="c-fc"></div><div class="legend" id="lg-fc"></div><div id="st-box"><h3>Staff per interval</h3><div class="chart" id="c-st"></div><div class="legend" id="lg-st"></div></div></div>
      <div class="tbl" id="tbl-prof" tabindex="0" role="region" aria-label="Values by interval" hidden></div>
    </section>
    <section class="card" aria-labelledby="t-q">
      <div class="head"><div><h2 id="t-q"></h2><div class="sub">Each queue against its own threshold. Click a name to filter; Ctrl + click adds.</div></div><div class="tools"><button class="btn" id="csv-q" type="button">Download CSV</button></div></div>
      <div class="tbl" id="tbl-q"></div><p class="note" id="n-q"></p>
    </section>
  </div>
</main>
<script>
(function () {
  'use strict';
  const { fmt, esc, showTip, hideTip, statusOf, STATUS_WORD, changeQuality } = Site, $ = (id) => document.getElementById(id), SV = Service;
  Site.renderChrome('service');
  const DAY = 864e5, iso = (t) => new Date(t).toISOString().slice(0, 10), ts = (s) => Date.parse(s + 'T00:00:00Z');
  const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const DEF = { days: '30', end: 'latest', ch: '1', metric: 'sl', q: [], dow: [], iv: null, day: null };
  const S = { ...DEF }, files = {};
  let IDX, KPI, EV, B = [], B0 = [], W, req = 0, events = true, tblDay = false, tblProf = false, cur = {};
  const carried = (m) => { try { if (m === null) sessionStorage.removeItem('happen-demo-month'); else if (m) sessionStorage.setItem('happen-demo-month', m); return sessionStorage.getItem('happen-demo-month'); } catch (e) { return null; } };
  const json = (u) => fetch(u, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(u + ': ' + r.status); return r.json(); });
  const chan = () => IDX.channels.find((c) => String(c.id) === S.ch), live = () => chan().live, queues = () => IDX.queues.filter((q) => String(q.channel) === S.ch), qName = (id) => IDX.queues.find((q) => q.id === id).name;
  const time = (i) => { const m = i * 15, h = Math.floor(m / 60); return `${h % 12 || 12}:${String(m % 60).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`; };
  const slot = (i) => `${time(i)} – ${time(i + 1 === 96 ? 0 : i + 1)}`;
  const secs = (s) => (s < 120 ? s + ' s' : s / 3600 + ' h');

  Promise.all([json('data/dashboards/kpis.json'), json('data/dashboards/service/index.json'), json('data/dashboards/events.json')]).then(([k, i, e]) => {
    KPI = Object.fromEntries(k.kpis.map((x) => [x.id, x])); IDX = i; EV = e.events;
    $('f-end').innerHTML = `<option value="latest">${fmt.date(i.data_through)} (latest)</option>` + i.months.slice(0, -1).reverse().map((m) => `<option value="${m}">${fmt.month(m)}</option>`).join('');
    $('f-channel').innerHTML = i.channels.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
    const p = new URLSearchParams(location.search), one = (id, v) => [...$(id).options].some((o) => o.value === v);
    if (one('f-days', p.get('days'))) S.days = p.get('days');
    if (one('f-end', p.get('end'))) S.end = p.get('end'); else if (one('f-end', carried())) S.end = carried();
    if (one('f-channel', p.get('ch'))) S.ch = p.get('ch');
    if (['sl', 'asa', 'abandon', 'volume', 'staffing', 'forecast'].includes(p.get('metric'))) S.metric = p.get('metric');
    S.q = p.getAll('q').map(Number).filter((x) => queues().some((q) => q.id === x));
    S.dow = p.getAll('dow').map(Number).filter((x) => DOW[x]);
    if (p.get('iv') && +p.get('iv') >= 0 && +p.get('iv') < 96) S.iv = +p.get('iv');
    if (/^\d{4}-\d\d-\d\d$/.test(p.get('day') || '')) S.day = p.get('day');
    Site.setDataThrough(i.data_through);
    $('footer-generated').textContent = `Data through ${fmt.date(i.data_through)} · exported ${fmt.date(i.generated_at)}, ${fmt.time(i.generated_at)} CT · Service & access operations v1.0`;
    return update();
  }).catch(fail);
  function fail(e) { $('loading').hidden = false; $('loading').textContent = 'The service data could not be loaded. ' + e.message; }

  // ---------- Data ----------
  async function month(m) {
    const u = `data/dashboards/service/${m}.json.gz`;
    return (files[u] ??= (async () => {
      const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(u + ': ' + r.status);
      const b = new Uint8Array(await r.arrayBuffer());
      const c = JSON.parse(b[0] === 0x1f && b[1] === 0x8b ? await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text() : new TextDecoder().decode(b)).cols;
      const days = []; for (let j = 0; j < c.d.length; j++) { const k = days[days.length - 1]; if (k && k.n === c.d[j]) k.to = j + 1; else { const t = ts(`${m}-${String(c.d[j]).padStart(2, '0')}`); days.push({ n: c.d[j], t, day: iso(t), dow: new Date(t).getUTCDay(), cols: c, from: j, to: j + 1 }); } }
      return days;
    })().catch((e) => { delete files[u]; throw e; }));
  }
  function windowOf() {
    let e = ts(IDX.data_through);
    if (S.end !== 'latest') { const [y, m] = S.end.split('-').map(Number); e = Date.UTC(y, m, 0); }
    const s = e - (+S.days - 1) * DAY;
    const first = ts(IDX.months[0] + '-01'), s0 = s - +S.days * DAY;   // compare only with a full earlier period
    return { s: Math.max(s, first), e, s0, e0: s - DAY, cmp: s0 >= first };
  }
  async function blocks(a, b) {
    const ms = IDX.months.filter((m) => m >= iso(a).slice(0, 7) && m <= iso(b).slice(0, 7));
    return (await Promise.all(ms.map(month))).flat().filter((k) => k.t >= a && k.t <= b);
  }
  // every filter except the ones a chart is asked to ignore (its own)
  function tester(skip = [], noDay) {
    const ids = new Set(queues().map((q) => q.id)), qs = S.q.length && !skip.includes('q') ? new Set(S.q) : ids, ds = S.dow.length && !skip.includes('dow') ? new Set(S.dow) : null, iv = skip.includes('iv') ? null : S.iv, day = noDay || skip.includes('day') ? null : S.day;
    return (k, c, j) => qs.has(c.q[j]) && (!ds || ds.has(k.dow)) && (iv == null || c.i[j] === iv) && (!day || k.day === day);
  }
  const G = (skip, key, b) => SV.group(b || B, tester(skip, b === B0), key);

  // ---------- KPIs for the chosen channel ----------
  function kpi(m) {
    const c = chan(), n = c.name.toLowerCase(), base = (o, id, short) => ({ ...KPI[id], ...o, short });
    if (m === 'sl') { const id = { 1: 'sl_phone', 2: 'sl_chat', 3: 'sl_email', 4: 'sl_callback', 5: 'sl_email' }[c.id]; return base({ name: 'Service level', ...(c.id === 3 || c.id === 5 ? { definition: `Share of ${n}s responded to within 24 hours.` } : {}) }, id, 'SL, ' + n); }
    if (m === 'asa') return c.id === 2 ? base({ name: 'Average speed of answer', target: 60, watch: 75, targetLabel: '≤ 60 s', definition: 'Average time answered chats waited in the queue before reaching an agent.', formula: 'Total queue wait of answered chats ÷ answered chats' }, 'asa_phone', 'ASA, chat') : base({ name: 'Average speed of answer' }, 'asa_phone', 'ASA, phone');
    if (m === 'abandon') return base({ name: 'Abandon rate', definition: `Share of ${c.id === 2 ? 'chats' : 'phone calls'} where the customer left before reaching an agent.` }, 'abandon', 'Abandon rate, ' + n);
    if (m === 'staffing') return base({ definition: `How far scheduled ${n} staff were above (+) or below (−) the staff needed to meet service level.` }, 'staffing', 'Staffing gap, ' + n);
    if (m === 'volume') return base({ definition: `All ${n} contacts customers started. No target; read the trend.` }, 'volume', 'Contacts, ' + n);
    return { id: 'forecast', name: 'Forecast error', short: 'Forecast error, ' + n, format: 'signedpct', better: 'range', target: [-10, 10], watch: [-15, 15], targetLabel: 'within ±10% a day', minN: 0, wiki: 'workforce', definition: 'How far contacts offered were above (+) or below (−) the forecast.', formula: '(Offered − forecast) ÷ forecast' };
  }
  const metrics = () => (live() ? ['sl', 'asa', 'abandon', 'volume', 'forecast', 'staffing'] : ['sl', 'volume', 'forecast']);
  const V = (m, v, full) => fmt.value(v, kpi(m).format, full);
  const low = (m, p) => SV.n(m, p) < kpi(m).minN;
  const stat = (m, p) => (low(m, p) ? 'none' : statusOf(kpi(m), SV.value(m, p)));
  const badge = (m, p) => (kpi(m).target == null ? '' : `<span class="status ${stat(m, p)}">${low(m, p) ? 'Too few' : STATUS_WORD[stat(m, p)]}</span>`);

  async function update() {
    const r = ++req;
    if (!metrics().includes(S.metric)) S.metric = 'sl';
    S.q = S.q.filter((x) => queues().some((q) => q.id === x));
    W = windowOf();
    if (S.day && (ts(S.day) < W.s || ts(S.day) > W.e)) S.day = null;
    const [b, b0] = await Promise.all([blocks(W.s, W.e), W.cmp ? blocks(W.s0, W.e0) : []]);
    if (r !== req) return;
    B = b; B0 = b0;
    $('loading').hidden = true; $('content').hidden = false;
    controls(); writeUrl(); render();
  }
  const go = () => { hideTip(); const k = Site.focusKey(); update().then(() => Site.restoreFocus(k, '#tiles button')).catch(fail); };
  function controls() {
    $('f-days').value = S.days; $('f-end').value = S.end; $('f-channel').value = S.ch;
    $('f-queue').innerHTML = `<option value="">All</option>` + (S.q.length > 1 ? `<option value="*" selected>${S.q.length} selected</option>` : '') + queues().map((q) => `<option value="${q.id}"${S.q.length === 1 && S.q[0] === q.id ? ' selected' : ''}>${esc(q.name)}</option>`).join('');
    $('f-dow').innerHTML = `<option value="">All</option>` + (S.dow.length > 1 ? `<option value="*" selected>${S.dow.length} selected</option>` : '') + DOW.map((d, i) => `<option value="${i}"${S.dow.length === 1 && S.dow[0] === i ? ' selected' : ''}>${d}</option>`).join('');
    const c = [...S.q.map((x) => ['q', x, 'Queue: ' + qName(x)]), ...S.dow.map((x) => ['dow', x, 'Day: ' + DOW[x]]), ...(S.iv != null ? [['iv', S.iv, 'Time: ' + slot(S.iv)]] : []), ...(S.day ? [['day', S.day, 'Date: ' + fmt.date(S.day)]] : [])];
    $('chips').innerHTML = c.map(([k, v, t]) => `<button type="button" class="chip" data-q="${k}" data-v="${v}" aria-label="Remove ${esc(t)}">${esc(t)} ×</button>`).join('');
    const n = c.length + ['days', 'end', 'ch'].filter((x) => S[x] !== DEF[x]).length;
    $('phone-f').textContent = n ? `Filters (${n})` : 'Filters';
    $('s-page').textContent = `${chan().name} · ${fmt.date(iso(W.s))} – ${fmt.date(iso(W.e))} · ${W.cmp ? `compared with the ${S.days} days before` : 'no full earlier period to compare'}`;
  }
  function writeUrl() {
    const p = new URLSearchParams();
    for (const k of ['days', 'end', 'ch', 'metric']) if (S[k] !== DEF[k]) p.set(k, S[k]);
    if (S.end === 'latest' && carried()) p.set('end', 'latest');
    S.q.forEach((x) => p.append('q', x)); S.dow.forEach((x) => p.append('dow', x));
    if (S.iv != null) p.set('iv', S.iv); if (S.day) p.set('day', S.day);
    history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
  }
  function toggle(k, v, add) { const a = S[k]; S[k] = a.includes(v) ? (add ? a.filter((x) => x !== v) : a.length > 1 ? [v] : []) : add ? [...a, v] : [v]; go(); }
  function render() { renderTiles(); renderDay(); renderHeat(); renderProfile(); renderQueues(); }

  // ---------- Tiles ----------
  function renderTiles() {
    const now = SV.total(G([], () => 1)), was = SV.total(G([], () => 1, B0)), host = $('tiles');
    const days = [...G([], (k) => k.day)].map(([d, p]) => ({ d, p })), comparable = !S.day && B0.length > 0;
    host.innerHTML = '';
    for (const m of metrics()) {
      const k = kpi(m), v = SV.value(m, now), lo = low(m, now), ch = comparable && was.rows ? fmt.change(v, SV.value(m, was), k.format) : null, q = ch ? changeQuality(k, v, SV.value(m, was), ch) : 'neutral';
      let val = V(m, v), st = badge(m, now), meta = k.target == null ? '' : 'Target ' + k.targetLabel;

    if (tblProf) { $('tbl-prof').innerHTML = `<table><thead><tr><th scope="col">Time</th><th scope="col">Offered</th><th scope="col">Forecast</th>${live() ? '<th scope="col">Scheduled FTE</th><th scope="col">Required FTE</th><th scope="col">Gap</th>' : ''}</tr></thead><tbody>${pts.map((x) => `<tr><td>${slot(x.i)}</td><td>${x.o.toFixed(1)}</td><td>${x.f.toFixed(1)}</td>${live() ? `<td>${x.h.toFixed(1)}</td><td>${x.r.toFixed(1)}</td><td>${V('staffing', SV.value('staffing', x.p), true)}</td>` : ''}</tr>`).join('')}</tbody></table>`; return; }
    prof('c-fc', 'lg-fc', pts, 'o', 'f', 'Contacts offered', 'Forecast', false); if (live()) prof('c-st', 'lg-st', pts, 'h', 'r', 'Scheduled FTE', 'Required FTE', true);
  }
  function prof(id, lg, pts, k1, k2, n1, n2, gap) {
    const host = $(id); host.innerHTML = ''; $(lg).innerHTML = ''; if (!pts.length) { host.textContent = 'No data for these filters.'; return; }
    const w = host.clientWidth || 800, H = 190, M = { t: 8, r: 12, b: 26, l: 56 }, iw = w - M.l - M.r, ih = H - M.t - M.b, i0 = pts[0].i, i1 = pts[pts.length - 1].i, n = i1 - i0 + 1, b = Math.max(...pts.flatMap((p) => [p[k1], p[k2]])) * 1.08 || 1, x = (i) => M.l + (i - i0 + .5) / n * iw, y = (v) => M.t + (b - v) / b * ih;
    const s = el('svg', { viewBox: `0 0 ${w} ${H}`, height: H, role: 'group', 'aria-label': `${n1} and ${n2} by time of day. Use View as table for values.` }, host), g = el('g', { class: 'g' }, s), ax = el('g', { class: 'ax' }, s);
    for (const t of ticks(0, b, 4)) { el('line', { x1: M.l, x2: M.l + iw, y1: y(t), y2: y(t) }, g); text(ax, M.l - 8, y(t) + 4, String(t), '', 'end'); }
    let lx = -99; for (let i = Math.ceil(i0 / 4) * 4; i <= i1; i += 4) { if (x(i) - lx < 46) continue; text(ax, x(i), H - 6, `${Math.floor(i / 4) % 12 || 12} ${i < 48 ? 'am' : 'pm'}`, '', 'middle'); lx = x(i); }
    if (gap) for (const p of pts) if (p.h < p.r) el('rect', { class: 'gap', x: x(p.i) - iw / n / 2, y: M.t, width: iw / n, height: ih }, s);
    const path = (k) => pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p[k]).toFixed(1)}`).join('');
    el('path', { class: 'l2', d: path(k2) }, s); el('path', { class: 'l1', d: path(k1) }, s);
    const dot = el('circle', { class: 'pt', r: 4.5, visibility: 'hidden' }, s);
    pts.forEach((p, j) => {
      const label = `${slot(p.i)}: ${n1} ${p[k1].toFixed(1)}, ${n2} ${p[k2].toFixed(1)}${gap && p.h < p.r ? ', understaffed' : ''}`;
      const h = el('rect', { class: 'hit', x: x(p.i) - iw / n / 2, y: M.t, width: iw / n, height: ih, tabindex: j ? -1 : 0, 'data-k': id + p.i, role: 'button', 'aria-pressed': S.iv === p.i, 'aria-label': label + '. Filter to this time' }, s);
      tip(h, () => `<b>${slot(p.i)}</b><br>${n1}: <b>${p[k1].toFixed(1)}</b><br>${n2}: ${p[k2].toFixed(1)}${gap ? `<br>Gap: ${V('staffing', SV.value('staffing', p.p), true)} of required` : `<br>Error: ${V('forecast', SV.value('forecast', p.p), true)}`}`, () => { S.iv = S.iv === p.i ? null : p.i; go(); });
      const show = () => { dot.setAttribute('cx', x(p.i)); dot.setAttribute('cy', y(p[k1])); dot.setAttribute('visibility', 'visible'); }, off = () => dot.setAttribute('visibility', 'hidden'); h.addEventListener('mousemove', show); h.addEventListener('focus', show); h.addEventListener('mouseleave', off); h.addEventListener('blur', off);
    });
    arrows(s, '.hit');
    $(lg).innerHTML = leg([['<line class="l1" x2="20" y1="7" y2="7"/>', n1], ['<line class="l2" x2="20" y1="7" y2="7"/>', n2], ...(gap ? [['<rect class="gap" style="fill-opacity:.4" width="20" height="14"/>', 'Fewer scheduled than required']] : [])]);
  }

  // ---------- Queues ----------
  function renderQueues() {
    const map = G(['q'], (b, c, j) => c.q[j]), was = SV.group(B0, tester(['q'], true), (b, c, j) => c.q[j]), byDay = G(['q'], (b, c, j) => c.q[j] + '|' + b.day), L = live(), cmp = !S.day && W.cmp;
    const rows = queues().map((q) => { const p = map.get(q.id) || SV.empty(), days = [...byDay].filter(([k]) => k.startsWith(q.id + '|')).map(([, d]) => d).filter((d) => !low('sl', d)); return { q, p, w: was.get(q.id), days: days.length, miss: days.filter((d) => stat('sl', d) !== 'good').length }; }).sort((a, b) => b.p.o - a.p.o);
    cur.q = rows; $('t-q').textContent = `Queues, ${chan().name.toLowerCase()}`;
    $('tbl-q').innerHTML = `<table><thead><tr><th scope="col">Queue</th><th scope="col">Threshold</th><th scope="col">Service level</th><th scope="col">Status</th>${cmp ? `<th scope="col">vs prior ${S.days} days</th>` : ''}<th scope="col">Days below target</th>${L ? '<th scope="col">ASA</th><th scope="col">Abandon rate</th><th scope="col">Staffing gap</th>' : ''}<th scope="col">Offered</th><th scope="col">vs forecast</th></tr></thead><tbody>${rows.map((r) => {
      const ch = cmp && r.w ? fmt.change(SV.value('sl', r.p), SV.value('sl', r.w), 'pct') : null, q = ch && !low('sl', r.p) ? changeQuality(kpi('sl'), SV.value('sl', r.p), SV.value('sl', r.w), ch) : 'neutral', on = S.q.includes(r.q.id), cell = (m) => `<td class="${low(m, r.p) ? 'low' : ''}">${V(m, SV.value(m, r.p), true)}${m !== 'forecast' && m !== 'staffing' && low(m, r.p) ? ' (too few)' : ''}</td>`;
      return `<tr class="${S.q.length ? (on ? 'sel' : 'faded') : ''}"><td><button type="button" class="name" data-k="q|${r.q.id}" data-id="${r.q.id}" aria-pressed="${on}">${esc(r.q.name)}</button></td><td>${kpi('sl').target}% in ${secs(r.q.sec)}</td>${cell('sl')}<td>${badge('sl', r.p)}</td>${cmp ? `<td>${ch ? `<span class="chg ${q}">${ch.flat ? '– No change' : (ch.delta > 0 ? '▲ ' : '▼ ') + ch.text}${Site.QUALITY_WORD[q] ? ' · ' + Site.QUALITY_WORD[q] : ''}</span>` : '–'}</td>` : ''}<td>${r.days ? `${r.miss} of ${r.days}` : '–'}</td>${L ? cell('asa') + cell('abandon') + cell('staffing') : ''}<td>${fmt.count(r.p.o)}</td>${cell('forecast')}</tr>`; }).join('')}</tbody></table>`;
    $('n-q').textContent = `Days below target counts days with at least ${kpi('sl').minN} contacts to rate.`;
  }

  // ---------- Events ----------
  for (const [id, key] of [['f-days', 'days'], ['f-end', 'end'], ['f-channel', 'ch']]) $(id).addEventListener('change', (e) => { S[key] = e.target.value; if (key === 'end') carried(S.end === 'latest' ? null : S.end); if (key === 'ch') { S.q = []; S.iv = null; } go(); });
  $('f-queue').addEventListener('change', (e) => { if (e.target.value !== '*') { S.q = e.target.value ? [+e.target.value] : []; go(); } });
  $('f-dow').addEventListener('change', (e) => { if (e.target.value !== '*') { S.dow = e.target.value ? [+e.target.value] : []; go(); } });
  $('chips').addEventListener('click', (e) => { const b = e.target.closest('[data-q]'); if (!b) return; const k = b.dataset.q; if (k === 'q' || k === 'dow') S[k] = S[k].filter((x) => x !== +b.dataset.v); else S[k] = null; go(); });
  $('tbl-q').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) toggle('q', +b.dataset.id, e.ctrlKey || e.metaKey); });
  $('tbl-worst').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) { const c = cur.worst[+b.dataset.i]; S.iv = c.i; S.dow = [c.dow]; go(); } });
  $('f-reset').addEventListener('click', () => { Object.assign(S, DEF, { q: [], dow: [] }); carried(null); events = $('t-events').checked = true; go(); });
  $('copy-link').addEventListener('click', (e) => Site.copyLink(e.currentTarget));
  $('phone-f').addEventListener('click', (e) => { const o = $('ctls').classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', o); });
  $('t-events').addEventListener('change', (e) => { events = e.target.checked; renderDay(); });
  $('tb-day').addEventListener('click', () => { tblDay = !tblDay; renderDay(); });
  $('tb-prof').addEventListener('click', () => { tblProf = !tblProf; renderProfile(); });
  const about = (w) => `Service & access operations · ${chan().name} · ${w} · ${iso(W.s)} to ${iso(W.e)} · filters: ${[...S.q.map((x) => 'queue=' + qName(x)), ...S.dow.map((x) => 'day=' + DOW[x]), ...(S.iv != null ? ['time=' + slot(S.iv)] : []), ...(S.day ? ['date=' + S.day] : [])].join('; ') || 'none'} · data through ${IDX.data_through}`;
  const csv = (name, w, head, rows) => Site.downloadCsv(`service-access_${name}_${chan().name.toLowerCase().replace(/ /g, '-')}`, IDX.data_through, about(w), head, rows);
  const raw = ['offered', 'answered', 'within_threshold', 'abandoned', 'short_abandoned', 'forecast', 'scheduled_fte', 'required_fte'], vals = (p) => [p.o, p.a, p.w, p.b, p.s, p.f, p.h, p.r];
  $('csv-day').addEventListener('click', () => csv('by-day', kpi(S.metric).name + ' by day', ['date', S.metric, ...raw], cur.day.slice().reverse().map((x) => [x.d, x.v, ...vals(x.p)])));
  $('csv-worst').addEventListener('click', () => csv('time-slots', 'time slots', ['day_of_week', 'time', 'past_threshold', 'service_level', 'asa', 'abandon_rate', ...raw], cur.worst.map((c) => [DOW[c.dow], slot(c.i), c.miss, SV.value('sl', c.p), SV.value('asa', c.p), SV.value('abandon', c.p), ...vals(c.p)])));
  $('csv-prof').addEventListener('click', () => csv('average-day', 'average day', ['time', 'offered', 'forecast', 'scheduled_fte', 'required_fte'], cur.prof.map((x) => [slot(x.i), x.o, x.f, x.h, x.r])));
  $('csv-q').addEventListener('click', () => csv('queues', 'queues', ['queue', 'threshold_sec', 'service_level', 'asa', 'abandon_rate', 'days_below_target', 'days_rated', ...raw], cur.q.map((r) => [r.q.name, r.q.sec, SV.value('sl', r.p), SV.value('asa', r.p), SV.value('abandon', r.p), r.miss, r.days, ...vals(r.p)])));
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (B.length) { renderDay(); renderHeat(); renderProfile(); } }, 150); });
})();
</script>
