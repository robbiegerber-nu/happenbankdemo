<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboards · Happen Bank Contact Center (demo)</title>
<meta name="description" content="Every dashboard in the simulated contact center demo, and what each one measures.">
<meta name="robots" content="noindex">
<script>
// Data quality used to live at this address. Old links to one of its runs, tabs, filters or incidents still work.
if ([...new URLSearchParams(location.search).keys()].some((k) => /^(run|tab|range|[fcvri]-(status|dim|table|text|show|sev|hist))$/.test(k)) || /^#inc/.test(location.hash)) location.replace('quality.html' + location.search + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=1.3">
<script src="assets/site.js?v=2.6"></script>
<style>
  main.wrap { padding-top: 40px; padding-bottom: 8px; }
  h1 { font-size: 36px; text-wrap: balance; }
  .lead { font-size: 17px; max-width: 62ch; margin: 10px 0 0; }
  .group { margin-top: 44px; }
  .group > h2 { font-size: 22px; }
  .group > p { margin: 4px 0 16px; color: var(--text-muted); }
  .cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px; }
  .card { grid-column: span 2; position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  .cards.two .card { grid-column: span 3; }
  .card:hover { border-color: var(--brand-blue); box-shadow: 0 6px 20px rgba(0, 0, 0, .1); }
  .card:has(.go:focus-visible) { outline: 2px solid var(--brand-blue); outline-offset: 2px; }
  .card .go:focus-visible { outline: none; }
  .shot { aspect-ratio: 1120 / 664; overflow: hidden; border-top: 1px solid var(--border); border-radius: 0 0 7px 7px; background: #F7F1ED; }
  .cards.two .shot { aspect-ratio: 2 / 1; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .body { flex: 1; display: flex; flex-direction: column; padding: 18px 20px 14px; min-width: 0; }
  .body h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .go { color: var(--text-primary); text-decoration: none; }
  .go::after { content: ""; position: absolute; inset: 0; border-radius: 8px; }   /* the whole card opens the dashboard */
  .card:hover .go { color: var(--brand-blue); }
  .q { margin: 4px 0 0; font-weight: 600; color: var(--text-primary); }
  .d { margin: 8px 0 14px; }
  .inc { margin: auto 0 6px; font-size: 13px; color: var(--text-muted); }
  .links { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .links a { position: relative; z-index: 1; display: inline-flex; align-items: center; min-height: 32px; padding: 3px 11px; font-size: 13px; color: var(--text-secondary); text-decoration: none; border: 1px solid var(--control); border-radius: 999px; background: var(--surface); }
  .links a:hover { color: var(--brand-blue); border-color: var(--brand-blue); text-decoration: underline; }
  .links span { display: inline-flex; align-items: center; min-height: 32px; padding: 3px 11px; font-size: 13px; border-radius: 999px; background: var(--surface-warm); }
  .open { margin: 14px 0 0; font-weight: 600; font-size: 14px; color: var(--brand-blue); }
  .card:hover .open { text-decoration: underline; }
  @media (max-width: 1023px) {
    .card { grid-column: span 3; }
    .cards.three .card:last-child { grid-column: span 6; }
    .cards.three .card:last-child .shot { aspect-ratio: 2.4 / 1; }
  }
  @media (max-width: 767px) {
    main.wrap { padding-top: 24px; }
    h1 { font-size: 28px; }
    .cards .card, .cards.two .card, .cards.three .card:last-child { grid-column: span 6; flex-direction: column; }
    .cards .shot, .cards.two .shot, .cards.three .card:last-child .shot { aspect-ratio: 2 / 1; }
    .links a { min-height: 40px; }
  }
</style>
</head>
<body>
<main class="wrap" id="main">
  <h1>Find the dashboard you need</h1>
  <p class="lead">Select any card to open its dashboard, or select a metric to go straight to it.</p>
  <div id="groups"></div>
</main>
<script>
(function () {
  'use strict';
  Site.renderChrome('home');
  const esc = Site.esc, IMG = 'assets/home/';
  // page and image name, title, question, description, label, [[link text, address ending]]
  const G = [
    ['Overview', 'Start here for the big picture.', 'two', [
      ['executive', 'Executive scorecard', 'Are we meeting our targets?', 'The whole contact center on one page. See each month’s results against target, what improved, and what needs attention.', 'Metrics include', [['Phone service level', '?kpi=sl_phone'], ['Customer satisfaction', '?kpi=csat'], ['Net promoter score', '?kpi=nps'], ['First contact resolution', '?kpi=fcr'], ['Occupancy', '?kpi=occupancy'], ['Contacts offered', '?kpi=volume']]],
      ['chat', 'Ask the data', 'Can I ask in my own words?', 'Pick a prepared question and get a plain-English answer, with a link to check every number. Open questions need an access code.', 'Ask about', [['Service'], ['Satisfaction'], ['Staffing'], ['Customers'], ['Launches'], ['Self-service']]]]],
    ['Operations', 'Run the day: wait times, staffing and coaching.', 'three', [
      ['service', 'Service & access', 'When and where do customers wait?', 'Find the days, times and queues where customers wait longest, and whether staffing or demand was behind it.', 'Metrics include', [['Service level', '?metric=sl'], ['Average speed of answer', '?metric=asa'], ['Abandon rate', '?metric=abandon'], ['Contacts offered', '?metric=volume'], ['Forecast error', '?metric=forecast'], ['Staffing vs required', '?metric=staffing']]],
      ['workforce', 'Workforce management', 'Do we have the right people at the right time?', 'Compare staff required, scheduled and available through the day, and see what takes people away from the queue.', 'Metrics include', [['Schedule adherence', '?metric=adherence'], ['Conformance', '?metric=conformance'], ['Shrinkage', '?metric=shrinkage'], ['Occupancy', '?metric=occupancy'], ['Staffing vs required', '?metric=staffing'], ['Forecast error', '?metric=forecast']]],
      ['coaching', 'Agent & team coaching', 'Who could use coaching, and on what?', 'Compare agents fairly on the same kind of work, and separate a real, consistent gap from chance.', 'Metrics include', [['Schedule adherence', '?metric=adherence'], ['Average handle time', '?metric=aht'], ['First contact resolution', '?metric=fcr'], ['Transfer rate', '?metric=transfer'], ['Customer satisfaction', '?metric=csat'], ['Quality score', '?metric=quality']]]]],
    ['Analysis', 'Work out what changed, why, and whether it matters.', 'two', [
      ['drivers', 'Performance driver explorer', 'What changed, and what drove it?', 'Break a month’s change into the queues, reasons, customers and teams behind it, then drill down as far as you need.', 'Metrics include', [['Phone service level', '?metric=sl_phone'], ['Abandon rate', '?metric=abandon'], ['Handle time', '?metric=aht_phone'], ['First contact resolution', '?metric=fcr'], ['Customer satisfaction', '?metric=csat'], ['Contacts offered', '?metric=volume']]],
      ['stability', 'Process stability monitor', 'Is this a real change or normal variation?', 'Control charts show each metric’s normal range and flag the points and patterns that are worth investigating.', 'Metrics include', [['Phone service level', '?metric=sl_phone'], ['Abandon rate', '?metric=abandon'], ['Handle time', '?metric=aht_phone'], ['Customer satisfaction', '?metric=csat'], ['Schedule adherence', '?metric=adherence'], ['Contacts offered', '?metric=volume']]]]],
    ['Customers', 'Understand who contacts us and how it goes for them.', 'two', [
      ['cx', 'Customer experience', 'How do customers feel, and what drives it?', 'Track satisfaction, effort, loyalty and complaints, and see which contact reasons pull the scores down.', 'Metrics include', [['Customer satisfaction', '?metric=csat'], ['Net promoter score', '?metric=nps'], ['Customer effort score', '?metric=ces'], ['First contact resolution', '?metric=fcr'], ['Repeat contact rate', '?metric=repeat'], ['Complaints', '?metric=complaints']]],
      ['personas', 'Customer & persona insights', 'Who contacts us most, and who has the worst experience?', 'Compare customer groups by persona, segment, age and digital enrollment.', 'Metrics include', [['Contact rate', '?metric=rate'], ['Customers who contacted', '?metric=reach'], ['Digital share', '?metric=digital'], ['Customer satisfaction', '?metric=csat'], ['Net promoter score', '?metric=nps'], ['Repeat contact rate', '?metric=repeat']]],
      ['launch', 'Product launch impact', 'What happens after a launch, and for how long?', 'See how many extra contacts each launch brought, which customers were affected, and when things returned to normal.', 'Metrics include', [['Contacts against expected', '?metric=volume'], ['Average handle time', '?metric=aht'], ['First contact resolution', '?metric=fcr'], ['Customer satisfaction', '?metric=csat'], ['Repeat contact rate', '?metric=repeat'], ['Service level', '?metric=sl']]],
      ['selfservice', 'Self-service & channel shift', 'Are phone menus and digital channels absorbing demand?', 'Follow the move from phone calls to phone menus and digital channels, and find where customers still need an agent.', 'Metrics include', [['IVR containment', '?metric=contain'], ['Handled without an agent', '?metric=no_agent'], ['Digital share', '?metric=digital'], ['Phone contacts', '?metric=phone'], ['Agent hours avoided', '?metric=hours'], ['Contacted within 7 days', '?metric=stuck']]]]],
    ['Data', 'Check the numbers behind every dashboard.', 'two', [
      ['quality', 'Data quality', 'Can we trust the data?', 'Automated checks run on every daily load. See the overall health score, what changed since the last run, and any incident and how it was fixed.', 'What’s inside', [['Health score', '?tab=overview'], ['Columns', '?tab=columns'], ['Daily volume', '?tab=volume'], ['Rules', '?tab=rules'], ['Incidents', '?tab=incidents']]]]]
  ];
  const link = (f, name) => ([t, u]) => `<li>${u ? `<a href="${f}.html${u}" aria-label="${esc(t)}, ${esc(name)}">${esc(t)}</a>` : `<span>${esc(t)}</span>`}</li>`;
  const card = ([f, name, q, d, label, links]) => `<article class="card">
    <div class="body"><h3><a class="go" href="${f}.html">${esc(name)}</a></h3><p class="q">${esc(q)}</p><p class="d">${esc(d)}</p>
      <p class="inc" id="i-${f}">${label}</p><ul class="links" aria-labelledby="i-${f}">${links.map(link(f, name)).join('')}</ul>
      <p class="open" aria-hidden="true">Open ${f === 'chat' ? name : 'dashboard'} →</p></div>
    <div class="shot"><img src="${IMG}${f}.jpg" alt="" width="1120" height="664"${f === 'executive' || f === 'chat' ? '' : ' loading="lazy"'}></div></article>`;
  document.getElementById('groups').innerHTML = G.map(([g, sub, cls, items]) => `<section class="group" aria-labelledby="g-${g}"><h2 id="g-${g}">${g}</h2><p>${esc(sub)}</p><div class="cards ${cls}">${items.map(card).join('')}</div></section>`).join('');
})();
</script>
</body>
</html>
