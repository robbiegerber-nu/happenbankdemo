<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workforce Management · Happen Bank Contact Center (demo)</title>
<meta name="description" content="Simulated adherence, shrinkage, occupancy and staffing, for demonstration only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=1.3">
<script src="assets/site.js?v=2.5"></script>
<script src="assets/workforce.js?v=1.0"></script>
<style>
  main.wrap { padding-top: 28px; }
  .sub { margin: 6px 0 0; color: var(--text-muted); font-size: 14px; }
  .note { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  .card { margin-top: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; min-height: 44px; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--brand-blue); }
  .ctls { display: contents; }
  @media (min-width: 768px) { .filter-bar .wrap { gap: 7px; } .ctls .filter { gap: 4px; } .ctls select { padding-left: 8px; padding-right: 20px; } #f-days { width: 104px; } #f-end { width: 196px; } #f-ch { width: 98px; } #f-site { width: 120px; } #f-team { width: 150px; } #f-dow { width: 116px; } }
  .phone-f { display: none; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chips:empty { display: none; }
  .chip { border: 1px solid var(--control); border-radius: 999px; background: var(--surface); padding: 6px 12px; font-size: 13px; min-height: 36px; cursor: pointer; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 18px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; cursor: pointer; }
  .tile:hover { border-color: var(--text-muted); }
  .tile.sel { border-color: var(--brand-blue); box-shadow: 0 0 0 1px var(--brand-blue); }
  .tile-top { display: flex; justify-content: space-between; gap: 6px; }
  .tile-top button.t { all: unset; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-primary); min-height: 24px; }
  .tile-top button.t:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 3px; border-radius: 4px; }
  .tile .v { font-size: 27px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; line-height: 1.2; }
  .tile .m { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .tile .chg { display: block; margin-top: 4px; white-space: normal; }
  .chart { margin-top: 10px; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .x { overflow-x: auto; }
  .legend { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-muted); margin-top: 8px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .tbl { overflow: auto; margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; max-height: 520px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 600; background: var(--surface-warm); position: sticky; top: 0; z-index: 1; }
  td.low { color: var(--text-muted); }
  tr.sel td { box-shadow: inset 0 2px 0 var(--brand-blue), inset 0 -2px 0 var(--brand-blue); }
  tr.faded td, tr.faded .name { color: var(--text-muted); font-weight: 400; }
  .name { border: 0; background: none; padding: 4px 0; min-height: 28px; cursor: pointer; color: var(--text-primary); font-weight: 600; text-align: left; }
  .name:hover { color: var(--brand-blue); }
  h3 { margin-top: 20px; }
  .ax text { fill: var(--text-muted); font-size: 12px; font-family: var(--font); }
  .g line { stroke: var(--grid); }
  .l1 { fill: none; stroke: var(--brand-blue); stroke-width: 2; stroke-linejoin: round; } .l2 { fill: none; stroke: var(--text-primary); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .pt { fill: var(--brand-blue); stroke: var(--surface); stroke-width: 1.5; } .pt.low { fill: var(--surface); stroke: var(--text-muted); } .pt.day { stroke: var(--text-primary); stroke-width: 2; }
  .tg { stroke: var(--text-primary); stroke-opacity: .7; stroke-width: 1.5; stroke-dasharray: 5 4; } .wb { fill: var(--watch-wash); fill-opacity: var(--wash-op); }
  .evb { fill: var(--event); fill-opacity: .12; } .evl { stroke: var(--event); stroke-opacity: .6; }
  .ev circle { fill: var(--surface); stroke: var(--event); } .ev text { fill: var(--text-muted); font-size: 10px; font-weight: 700; text-anchor: middle; font-family: var(--font); }
  .lab { fill: var(--text-secondary); font-size: 12px; font-family: var(--font); }
  .hit { fill: transparent; cursor: pointer; }
  .hit:focus-visible, .hm:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 2px; }
  .cell { fill: var(--brand-blue); } .cell0 { fill: var(--surface-warm); } .cell-low { fill: none; stroke: var(--grid); }
  .cell-sel { fill: none; stroke: var(--text-primary); stroke-width: 2.5; } .cell-cur { fill: none; stroke: var(--off-ink); stroke-width: 2; }
  .dow { fill: var(--text-secondary); font-size: 12.5px; font-family: var(--font); cursor: pointer; } .dow.sel { font-weight: 700; fill: var(--brand-blue); }
  .l3 { fill: none; stroke: var(--text-muted); stroke-width: 1.5; } .bar { fill: var(--brand-blue); } .bar.low { fill: var(--text-muted); fill-opacity: .35; } .tick0 { stroke: var(--text-primary); stroke-width: 2; }
  .sm-h { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-top: 10px; }
  .gap { fill: var(--off-wash); fill-opacity: .18; }
  @media (max-width: 767px) {
    .phone-f { display: inline-flex; align-items: center; }
    .ctls { display: none; flex-basis: 100%; flex-direction: column; gap: 8px; }
    .ctls.open { display: flex; }
    .ctls .filter { flex: none; }
    .ctls .filter .flabel { position: static; width: auto; height: auto; clip: auto; min-width: 90px; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .card { padding: 14px; }
    .tile .v { font-size: 22px; }
    .name, .chip { min-height: 44px; }
  }
</style>
</head>
<body>
<div class="filter-bar" role="region" aria-label="Filters"><div class="wrap">
  <button class="btn phone-f" id="phone-f" type="button" aria-expanded="false" aria-controls="ctls">Filters</button>
  <div class="ctls" id="ctls">
    <label class="filter"><span class="flabel">Period</span><select id="f-days"><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></label>
    <label class="filter"><span class="flabel">Ending</span><select id="f-end"></select></label>
    <label class="filter"><span class="flabel">Group</span><select id="f-ch"></select></label>
    <label class="filter"><span class="flabel">Site</span><select id="f-site"></select></label>
    <label class="filter"><span class="flabel">Team</span><select id="f-team"></select></label>
    <label class="filter"><span class="flabel">Day</span><select id="f-dow"></select></label>
    <button class="link-btn" id="f-reset" type="button">Reset</button>
  </div>
  <span class="spacer"></span><button class="btn" id="copy-link" type="button">Copy link</button>
</div></div>
<main class="wrap" id="main">
  <h1>Workforce management</h1>
  <p class="sub" id="s-page"></p>
  <div class="chips" id="chips"></div>
  <p class="note" id="loading">Loading workforce data…</p>
  <div id="content" hidden>
    <div class="tiles" id="tiles"></div>
    <p class="note" id="n-tiles"></p>
    <section class="card" aria-labelledby="t-day">
      <div class="head"><div><h2 id="t-day"></h2><div class="sub" id="s-day"></div></div><div class="tools"><label class="toggle"><input type="checkbox" id="t-events" checked> Show events</label><button class="btn" id="csv-day" type="button" hidden>Download CSV</button><button class="btn" id="tb-day" type="button">View as table</button></div></div>
      <div class="chart" id="c-day"></div><div class="legend" id="lg-day"></div><div class="tbl" id="tbl-day" tabindex="0" role="region" aria-label="Values by day" hidden></div>
    </section>
    <section class="card" aria-labelledby="t-prof">
      <div class="head"><div><h2 id="t-prof"></h2><div class="sub" id="s-prof"></div></div><div class="tools"><button class="btn" id="csv-prof" type="button" hidden>Download CSV</button><button class="btn" id="tb-prof" type="button">View as table</button></div></div>
      <div id="prof-box"><div class="chart" id="c-prof"></div><div class="legend" id="lg-prof"></div><h3>Staff not available, by reason</h3><p class="note">Same time axis and the same vertical scale for every reason. Scheduled breaks and lunches are outlined; filled is what happened.</p><div id="c-off"></div></div>
      <div class="tbl" id="tbl-prof" tabindex="0" role="region" aria-label="Values by time of day" hidden></div>
    </section>
    <section class="card" id="sec-slots" aria-labelledby="t-slots">
      <div class="head"><div><h2 id="t-slots"></h2><div class="sub" id="s-slots"></div></div><div class="tools"><button class="btn" id="csv-slots" type="button">Download CSV</button></div></div>
      <div class="tbl" id="tbl-slots"></div><p class="note" id="n-slots"></p>
    </section>
    <section class="card" aria-labelledby="t-shr">
      <div class="head"><div><h2 id="t-shr"></h2><div class="sub" id="s-shr"></div></div><div class="tools"><button class="btn" id="csv-shr" type="button">Download CSV</button></div></div>
      <div class="chart" id="c-shr"></div><p class="note" id="n-shr"></p>
    </section>
    <section class="card" aria-labelledby="t-team">
      <div class="head"><div><h2 id="t-team"></h2><div class="sub">Click a name to filter; Ctrl + click adds. Minutes are per agent-day worked.</div></div><div class="tools"><button class="btn" id="csv-team" type="button">Download CSV</button></div></div>
      <div class="tbl" id="tbl-team"></div>
    </section>
  </div>
</main>
<script>
(function () {
  'use strict';
  const { fmt, esc, showTip, hideTip, statusOf, STATUS_WORD, changeQuality } = Site, $ = (id) => document.getElementById(id), WF = Workforce;
  Site.renderChrome('workforce');
  const DAY = 864e5, iso = (t) => new Date(t).toISOString().slice(0, 10), ts = (s) => Date.parse(s + 'T00:00:00Z'), dowOf = (d) => new Date(ts(d)).getUTCDay();
  const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  // agent groups, and the channels their requirement covers (phone agents also make callbacks)
  const GROUPS = { 1: { name: 'Phone', serves: 'phone and callback', ch: [1, 4] }, 2: { name: 'Chat', serves: 'chat', ch: [2] }, 3: { name: 'Email', serves: 'email and secure message', ch: null } };
  const DEF = { days: '30', end: 'latest', ch: '1', site: '', metric: 'adherence', team: [], dow: [], iv: null, day: null }, S = { ...DEF, team: [], dow: [] };
  const files = {}; let IDX, SVC, KPI, EV, ROWS, W, req = 0, events = true, tblDay = false, tblProf = false, A, B0, cur = {};
  const carried = (m) => { try { if (m === null) sessionStorage.removeItem('happen-demo-month'); else if (m) sessionStorage.setItem('happen-demo-month', m); return sessionStorage.getItem('happen-demo-month'); } catch (e) { return null; } };
  const get = async (u) => { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(u + ': ' + r.status); const b = new Uint8Array(await r.arrayBuffer()); return JSON.parse(b[0] === 0x1f && b[1] === 0x8b ? await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text() : new TextDecoder().decode(b)); };
  const file = (u) => (files[u] ??= get(u).catch((e) => { delete files[u]; throw e; }));
  const time = (i) => { const m = i * 15, h = Math.floor(m / 60); return `${h % 12 || 12}:${String(m % 60).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`; }, slot = (i) => `${time(i)} – ${time((i + 1) % 96)}`;
  const G = () => GROUPS[S.ch], teams = () => IDX.teams.filter((t) => String(t.ch) === S.ch), tName = (id) => IDX.teams.find((t) => t.id === id).name;
  const whole = () => !S.site && !S.team.length;                    // the requirement exists only for a whole group
  const canReq = () => !!G().ch && whole();
  const METRICS = () => ['adherence', 'conformance', 'shrinkage', 'occupancy', ...(canReq() ? ['staffing', 'forecast'] : [])];

  Promise.all([file('data/dashboards/kpis.json'), file('data/dashboards/workforce/index.json.gz'), file('data/dashboards/service/index.json'), file('data/dashboards/events.json')]).then(([k, i, s, e]) => {
    KPI = Object.fromEntries([...k.kpis, ...k.extra].map((x) => [x.id, x])); IDX = i; SVC = s; EV = e.events;
    ROWS = i.days.map((r) => Object.fromEntries(i.keys.map((c, j) => [c, r[j]])));
    $('f-end').innerHTML = `<option value="latest">${fmt.date(i.data_through)} (latest)</option>` + i.months.slice(0, -1).reverse().map((m) => `<option value="${m}">${fmt.month(m)}</option>`).join('');
    $('f-ch').innerHTML = Object.entries(GROUPS).map(([id, g]) => `<option value="${id}">${g.name}</option>`).join('');
    const p = new URLSearchParams(location.search), one = (id, v) => [...$(id).options].some((o) => o.value === v);
    if (one('f-days', p.get('days'))) S.days = p.get('days');
    if (one('f-end', p.get('end'))) S.end = p.get('end'); else if (one('f-end', carried())) S.end = carried();
    if (one('f-ch', p.get('ch'))) S.ch = p.get('ch');
    if (teams().some((t) => t.site === p.get('site'))) S.site = p.get('site');
    if (['adherence', 'conformance', 'shrinkage', 'occupancy', 'staffing', 'forecast'].includes(p.get('metric'))) S.metric = p.get('metric');
    S.team = p.getAll('team').map(Number).filter((x) => teams().some((t) => t.id === x)); S.dow = p.getAll('dow').map(Number).filter((x) => DOW[x]);
    if (p.get('iv') != null && +p.get('iv') >= 0 && +p.get('iv') < 96) S.iv = +p.get('iv');
    if (/^\d{4}-\d\d-\d\d$/.test(p.get('day') || '')) S.day = p.get('day');
    Site.setDataThrough(i.data_through);
    $('footer-generated').textContent = `Data through ${fmt.date(i.data_through)} · exported ${fmt.date(i.generated_at)}, ${fmt.time(i.generated_at)} CT · Workforce management v1.0`;
    return update();
  }).catch(fail);
  function fail(e) { $('loading').hidden = false; $('loading').textContent = 'The workforce data could not be loaded. ' + e.message; }
  function windowOf() {
    let e = ts(IDX.data_through); if (S.end !== 'latest') { const [y, m] = S.end.split('-').map(Number); e = Date.UTC(y, m, 0); }
    const s = e - (+S.days - 1) * DAY, first = ts(IDX.months[0] + '-01'), s0 = s - +S.days * DAY;
    return { s: Math.max(s, first), e, s0, e0: s - DAY, cmp: s0 >= first };
  }
  // ---------- Data: every filter except the ones a chart ignores ----------
  function okTeam(id, skip) { const t = IDX.teams.find((x) => x.id === id); return t && String(t.ch) === S.ch && (!S.site || t.site === S.site) && (skip || !S.team.length || S.team.includes(id)); }
  function okDay(d, skip = []) { return (skip.includes('dow') || !S.dow.length || S.dow.includes(dowOf(d))) && (skip.includes('day') || !S.day || S.day === d); }
  function daily(a, b, key, skip = []) {
    const out = new Map();
    for (const r of ROWS) { const t = ts(r.d); if (t < a || t > b || !okTeam(r.t, skip.includes('team')) || !okDay(r.d, skip)) continue; const k = key(r); WF.add(out.get(k) || (out.set(k, {}), out.get(k)), r, WF.DAY); }
    return out;
  }
  // interval rows of a window: [{ d, i, t, ...minutes }] as blocks of columns, plus the requirement and forecast
  async function load(a, b) {
    const ms = IDX.months.filter((m) => m >= iso(a).slice(0, 7) && m <= iso(b).slice(0, 7)), f = G().ch;
    const [w, s] = await Promise.all([Promise.all(ms.map((m) => file(`data/dashboards/workforce/${m}.json.gz`))), f ? Promise.all(ms.map((m) => file(`data/dashboards/service/${m}.json.gz`))) : []]);
    const inWin = (m, d) => { const t = ts(`${m}-${String(d).padStart(2, '0')}`); return t >= a && t <= b; }, iv = [], rq = [], qs = f ? new Set(SVC.queues.filter((q) => f.includes(q.channel)).map((q) => q.id)) : null;
    w.forEach((x) => { const c = x.cols; for (let j = 0; j < c.d.length; j++) if (inWin(x.m, c.d[j]) && okTeam(c.t[j])) iv.push({ d: `${x.m}-${String(c.d[j]).padStart(2, '0')}`, i: c.i[j], c, j }); });
    s.forEach((x) => { const c = x.cols; for (let j = 0; j < c.d.length; j++) if (qs.has(c.q[j]) && inWin(x.m, c.d[j])) rq.push({ d: `${x.m}-${String(c.d[j]).padStart(2, '0')}`, i: c.i[j], r: c.r[j] * 15, o: c.o[j], f: c.f[j], own: c.q[j] }); });
    // callbacks can be requested on a closed day, when no one is scheduled: that is not a staffing shortfall
    const open = new Set(); for (const x of iv) if (x.c.open[x.j] > 0) open.add(x.d);
    for (const x of rq) if (!open.has(x.d)) x.r = 0;
    return { iv, rq };
  }
  function intervals(data, key, skip = []) {   // agent minutes by key, with req/o/f joined
    const out = new Map(), at = (k) => out.get(k) || (out.set(k, {}), out.get(k)), okI = (x) => skip.includes('iv') || S.iv == null || S.iv === x.i;
    for (const x of data.iv) { if (!okDay(x.d, skip) || !okI(x)) continue; const p = at(key(x)); for (const k of WF.IV) p[k] = (p[k] || 0) + x.c[k][x.j]; }
    if (canReq()) for (const x of data.rq) { if (!okDay(x.d, skip) || !okI(x)) continue; const p = at(key(x)); p.req = (p.req || 0) + x.r; p.o = (p.o || 0) + x.o; p.f = (p.f || 0) + x.f; }
    return out;
  }
  const sum = (map, keys) => { const t = {}; for (const p of map.values()) WF.add(t, p, keys); return t; };
  const ALLIV = [...WF.IV, 'req', 'o', 'f'];
  function total(a, b, data, skip) { const t = sum(daily(a, b, () => 1, skip), WF.DAY); return Object.assign(t, sum(intervals(data, () => 1, skip), ALLIV), { aux: t.aux }); }

  async function update() {
    const r = ++req;
    S.team = S.team.filter((x) => okTeam(x, true));
    if (!METRICS().includes(S.metric)) S.metric = 'adherence';
    W = windowOf(); if (S.day && (ts(S.day) < W.s || ts(S.day) > W.e)) S.day = null;
    const [a, b] = await Promise.all([load(W.s, W.e), W.cmp ? load(W.s0, W.e0) : { iv: [], rq: [] }]);
    if (r !== req) return; A = a; B0 = b;
    $('loading').hidden = true; $('content').hidden = false;
    controls(); writeUrl(); renderTiles(); renderDay(); renderProfile(); renderSlots(); renderShrink(); renderTeams();
  }
  const go = () => { hideTip(); const k = Site.focusKey(); update().then(() => Site.restoreFocus(k, '#tiles button')).catch(fail); };
  function controls() {
    $('f-days').value = S.days; $('f-end').value = S.end; $('f-ch').value = S.ch;
    const many = (a) => (a.length > 1 ? `<option value="*" selected>${a.length} selected</option>` : '');
    $('f-site').innerHTML = `<option value="">All</option>` + [...new Set(teams().map((t) => t.site))].sort().map((s) => `<option${S.site === s ? ' selected' : ''}>${esc(s)}</option>`).join('');
    $('f-team').innerHTML = `<option value="">All</option>` + many(S.team) + teams().filter((t) => !S.site || t.site === S.site).map((t) => `<option value="${t.id}"${S.team.length === 1 && S.team[0] === t.id ? ' selected' : ''}>${esc(t.name)}</option>`).join('');
    $('f-dow').innerHTML = `<option value="">All</option>` + many(S.dow) + DOW.map((d, i) => `<option value="${i}"${S.dow.length === 1 && S.dow[0] === i ? ' selected' : ''}>${d}</option>`).join('');
    const c = [...(S.site ? [['site', S.site, 'Site: ' + S.site]] : []), ...S.team.map((x) => ['team', x, 'Team: ' + tName(x)]), ...S.dow.map((x) => ['dow', x, 'Day: ' + DOW[x]]), ...(S.iv != null ? [['iv', S.iv, 'Time: ' + slot(S.iv)]] : []), ...(S.day ? [['day', S.day, 'Date: ' + fmt.date(S.day)]] : [])];
    $('chips').innerHTML = c.map(([k, v, t]) => `<button type="button" class="chip" data-q="${k}" data-v="${esc(v)}" aria-label="Remove ${esc(t)}">${esc(t)} ×</button>`).join('');
    const n = c.length + ['days', 'end', 'ch'].filter((x) => S[x] !== DEF[x]).length; $('phone-f').textContent = n ? `Filters (${n})` : 'Filters';
    $('s-page').textContent = `${G().name} agents (${G().serves}) · ${fmt.date(iso(W.s))} – ${fmt.date(iso(W.e))} · ${W.cmp ? `compared with the ${S.days} days before` : 'no full earlier period to compare'}`;
  }
  function writeUrl() {

    const rows = WF.REASONS.map(([k, n, planned]) => ({ k, n, planned, m: now[k] || 0, v: now.sched > 0 ? (now[k] || 0) / now.sched * 100 : 0, w: was && was.sched > 0 ? (was[k] || 0) / was.sched * 100 : null })).sort((a, b) => b.v - a.v); cur.shr = rows;
    $('t-shr').textContent = `Shrinkage by reason, ${G().name.toLowerCase()} agents`; $('s-shr').textContent = `Share of scheduled minutes${was ? `; the tick marks the ${S.days} days before` : ''}`;
    if (!(now.sched > 0)) { host.textContent = 'No data for these filters.'; $('n-shr').textContent = ''; return; }
    const w = host.clientWidth || 800, narrow = w < 560, lw = narrow ? 130 : 230, vw = narrow ? 64 : 150, rh = 30, H = rows.length * rh + 4, max = Math.max(...rows.flatMap((r) => [r.v, r.w || 0])) * 1.04 || 1, x = (v) => lw + v / max * (w - lw - vw);
    const s = el('svg', { viewBox: `0 0 ${w} ${H}`, height: H, role: 'img', 'aria-label': 'Shrinkage by reason: ' + rows.map((r) => `${r.n} ${r.v.toFixed(1)}%`).join(', ') }, host);
    rows.forEach((r, i) => { const y = 2 + i * rh; text(s, lw - 10, y + 19, r.n, 'lab', 'end'); el('rect', { class: 'bar', x: lw, y: y + 7, width: Math.max(1, x(r.v) - lw), height: rh - 14, rx: 2 }, s); if (r.w != null) el('line', { class: 'tick0', x1: x(r.w), x2: x(r.w), y1: y + 4, y2: y + rh - 4 }, s); text(s, w - vw + 8, y + 19, `${r.v.toFixed(1)}%${narrow ? '' : r.planned ? ' · planned' : ' · unplanned'}`, 'lab'); });
    const pl = rows.filter((r) => r.planned).reduce((a, r) => a + r.v, 0), un = rows.filter((r) => !r.planned).reduce((a, r) => a + r.v, 0);
    $('n-shr').textContent = `Planned ${pl.toFixed(1)}% · unplanned ${un.toFixed(1)}% · total ${(pl + un).toFixed(1)}%. PTO is not in scheduled minutes: ${fmt.count(now.npto || 0)} agent-days of PTO, beside ${fmt.count((now.n || 0) + (now.nabs || 0))} scheduled.`;
  }

  // ---------- Teams ----------
  function renderTeams() {
    const map = daily(W.s, W.e, (r) => r.t, ['team']), rows = teams().filter((t) => !S.site || t.site === S.site).map((t) => ({ t, p: map.get(t.id) || {} })).filter((r) => (r.p.n || 0) + (r.p.nabs || 0) > 0).sort((a, b) => (val('adherence', a.p) ?? 999) - (val('adherence', b.p) ?? 999)); cur.team = rows;
    $('t-team').textContent = `Teams, ${G().name.toLowerCase()} agents`;
    const c = (m, p) => `<td class="${low(m, p) ? 'low' : ''}">${V(m, val(m, p), true)}${low(m, p) ? ' (too few)' : ''}</td>`, per = (v, p) => (p.n > 0 ? (v / p.n).toFixed(1) + ' min' : '–');
    $('tbl-team').innerHTML = `<table><thead><tr><th scope="col">Team</th><th scope="col">Site</th><th scope="col">Adherence</th><th scope="col">Status</th><th scope="col">Conformance</th><th scope="col">Shrinkage</th><th scope="col">Occupancy</th><th scope="col">Absence</th><th scope="col">Unplanned</th><th scope="col">Long breaks</th><th scope="col">Late start</th><th scope="col">Early finish</th><th scope="col">Agent-days</th></tr></thead><tbody>${rows.map(({ t, p }) => { const on = S.team.includes(t.id); return `<tr class="${S.team.length ? (on ? 'sel' : 'faded') : ''}"><td><button type="button" class="name" data-k="team|${t.id}" data-id="${t.id}" aria-pressed="${on}">${esc(t.name)}</button>${t.sup ? `<div class="muted">Supervisor: ${esc(t.sup)}</div>` : ''}</td><td>${esc(t.site)}</td>${c('adherence', p)}<td>${badge('adherence', p)}</td>${c('conformance', p)}${c('shrinkage', p)}${c('occupancy', p)}<td>${p.sched > 0 ? (p.abs / p.sched * 100).toFixed(1) + '%' : '–'}</td><td>${per(p.aux, p)}</td><td>${per(p.ext, p)}</td><td>${per(p.late, p)}</td><td>${per(p.early, p)}</td><td>${fmt.count(p.n || 0)}</td></tr>`; }).join('')}</tbody></table>`;
  }

  // ---------- Events ----------
  for (const [id, key] of [['f-days', 'days'], ['f-end', 'end'], ['f-ch', 'ch'], ['f-site', 'site']]) $(id).addEventListener('change', (e) => { S[key] = e.target.value; if (key === 'end') carried(S.end === 'latest' ? null : S.end); if (key === 'ch') { S.site = ''; S.team = []; S.iv = null; } if (key === 'site') S.team = []; go(); });
  for (const [id, key] of [['f-team', 'team'], ['f-dow', 'dow']]) $(id).addEventListener('change', (e) => { if (e.target.value !== '*') { S[key] = e.target.value ? [+e.target.value] : []; go(); } });
  $('chips').addEventListener('click', (e) => { const b = e.target.closest('[data-q]'); if (!b) return; const k = b.dataset.q; if (k === 'team' || k === 'dow') S[k] = S[k].filter((x) => x !== +b.dataset.v); else S[k] = k === 'site' ? '' : null; go(); });
  $('tbl-team').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) toggle('team', +b.dataset.id, e.ctrlKey || e.metaKey); });
  $('tbl-slots').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) { const r = cur.slots[+b.dataset.i]; S.dow = [r.dow]; S.iv = r.i; go(); } });
  $('f-reset').addEventListener('click', () => { Object.assign(S, DEF, { team: [], dow: [] }); carried(null); events = $('t-events').checked = true; go(); });
  $('copy-link').addEventListener('click', (e) => Site.copyLink(e.currentTarget));
  $('phone-f').addEventListener('click', (e) => { const o = $('ctls').classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', o); });
  $('t-events').addEventListener('change', (e) => { events = e.target.checked; renderDay(); });
  $('tb-day').addEventListener('click', () => { tblDay = !tblDay; renderDay(); }); $('tb-prof').addEventListener('click', () => { tblProf = !tblProf; renderProfile(); });
  const about = (w) => `Workforce management · ${G().name} agents · ${w} · ${iso(W.s)} to ${iso(W.e)} · filters: ${[...(S.site ? ['site=' + S.site] : []), ...S.team.map((x) => 'team=' + tName(x)), ...S.dow.map((x) => 'day=' + DOW[x]), ...(S.iv != null ? ['time=' + slot(S.iv)] : []), ...(S.day ? ['date=' + S.day] : [])].join('; ') || 'none'} · data through ${IDX.data_through}`;
  const csv = (n, w, h, r) => Site.downloadCsv(`workforce_${n}_${G().name.toLowerCase()}`, IDX.data_through, about(w), h, r);
  $('csv-day').addEventListener('click', () => csv('by-day', kpi(S.metric).name + ' by day', ['date', S.metric, 'n'], cur.day.slice().reverse().map((x) => [x.d, x.v, WF.n(S.metric, x.p)])));
  $('csv-prof').addEventListener('click', () => csv('average-day', 'average day, FTE', ['time', 'required', 'scheduled', 'available', ...OFF.map((o) => o[0])], cur.prof.map((x) => [slot(x.i), ...[x.p.req, x.p.open, x.p.avail, ...OFF.map((o) => o[1](x.p))].map((v) => (v || 0) / 15 / cur.nd)])));
  $('csv-slots').addEventListener('click', () => csv('short-slots', 'slots short of staff, FTE', ['day_of_week', 'time', 'required', 'scheduled', 'available', 'gap', 'on_scheduled_break_lunch_meeting', 'unplanned', 'absent'], cur.slots.map((r) => [DOW[r.dow], slot(r.i), r.req, r.open, r.av, r.gap, r.off, r.aux, r.abs])));
  $('csv-shr').addEventListener('click', () => csv('shrinkage', 'shrinkage by reason', ['reason', 'planned', 'minutes', 'share_of_scheduled_pct', 'prior_pct'], cur.shr.map((r) => [r.n, r.planned ? 'planned' : 'unplanned', r.m, r.v, r.w])));
  $('csv-team').addEventListener('click', () => csv('teams', 'teams', ['team', 'site', 'supervisor', 'adherence', 'conformance', 'shrinkage', 'occupancy', ...WF.DAY], cur.team.map(({ t, p }) => [t.name, t.site, t.sup, val('adherence', p), val('conformance', p), val('shrinkage', p), val('occupancy', p), ...WF.DAY.map((k) => p[k])])));
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (A) { renderDay(); renderProfile(); renderShrink(); } }, 150); });
})();
</script>
