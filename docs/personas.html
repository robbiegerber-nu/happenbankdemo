<html lang="en">

<style>

  td.low { color: var(--text-muted); }

  .name:hover { color: var(--brand-blue); }

  .ax text { fill: var(--text-muted); font-size: 12px; font-family: var(--font); }
  .g line { stroke: var(--grid); }

  @media (max-width: 767px) { .tiles { grid-template-columns: 1fr 1fr; } .phone-note { display: block; } .wide-only { display: none; } .card .btn, .tools .filter select { min-height: 44px; } .tools .filter { flex: none; } }
</style>
</head>
<body>
<div class="filter-bar" role="region" aria-label="Filters"><div class="wrap">
  <button class="btn phone-f" id="phone-f" type="button" aria-expanded="false" aria-controls="ctls">Filters</button>

    <label class="filter"><span class="flabel">Age</span><select id="f-a"></select></label>

  <span class="spacer"></span><button class="btn" id="copy-link" type="button">Copy link</button>
</div></div>
<main class="wrap" id="main">
  <h1>Customer &amp; persona insights</h1>
  <p class="sub" id="s-page"></p>
  <p class="note phone-note">Open on a larger screen to see channels, reasons and repeat users.</p>
  <div class="chips" id="chips"></div>
  <p class="note" id="loading">Loading customer data…</p>
  <div id="content" hidden>
    <p class="about" id="about"></p>
    <div class="tiles" id="tiles"></div>
    <p class="note">Identified customers only. Digital enrollment and persona are today's, in every quarter. Closed customer relationships aren't recorded, so the number of customers can only grow.</p>
    <section class="card" aria-labelledby="t-grp">
      <div class="head"><div><h2 id="t-grp"></h2><div class="sub" id="s-grp"></div></div><div class="tools"><label class="filter"><span>By</span><select id="f-dim"><option value="p">Persona</option><option value="s">Segment</option><option value="a">Age band</option><option value="d">Digital enrollment</option></select></label><button class="btn" id="csv-grp" type="button">Download CSV</button></div></div>
      <div class="tbl" id="tbl-grp"></div><p class="note" id="n-grp"></p>
    </section>
    <section class="card" aria-labelledby="t-tr">
      <div class="head"><div><h2 id="t-tr"></h2><div class="sub" id="s-tr"></div></div><div class="tools"><button class="btn" id="csv-tr" type="button">Download CSV</button><button class="btn" id="tb-tr" type="button">View as table</button></div></div>
      <div class="sm" id="c-tr"></div><div class="legend" id="lg-tr"></div><div class="tbl" id="tbl-tr" tabindex="0" role="region" aria-label="Values by month" hidden></div>
    </section>
    <section class="card wide-only" aria-labelledby="t-ch">
      <div class="head"><div><h2 id="t-ch"></h2><div class="sub" id="s-ch"></div></div><div class="tools"><button class="btn" id="csv-ch" type="button">Download CSV</button><button class="btn" id="tb-ch" type="button">View as table</button></div></div>
      <div class="chart" id="c-ch"></div><div class="legend" id="lg-ch"></div><div class="tbl" id="tbl-ch" tabindex="0" role="region" aria-label="Channel mix" hidden></div><p class="note" id="n-ch"></p>
    </section>
    <section class="card wide-only" aria-labelledby="t-rea">
      <div class="head"><div><h2 id="t-rea"></h2><div class="sub" id="s-rea"></div></div><div class="tools"><button class="btn" id="csv-rea" type="button">Download CSV</button></div></div>
      <div class="tbl" id="tbl-rea"></div><p class="note" id="n-rea"></p>
    </section>
    <section class="card wide-only" aria-labelledby="t-hv">
      <div class="head"><div><h2 id="t-hv"></h2><div class="sub" id="s-hv"></div></div><div class="tools"><button class="btn" id="csv-hv" type="button">Download CSV</button></div></div>
      <div class="tbl" id="tbl-hv"></div>
    </section>
  </div>
</main>
<script>
(function () {
  'use strict';

  Site.renderChrome('personas');
  const DEF = { q: '', cmp: 'prior', p: '', s: '', a: '', d: '', metric: 'csat', dim: 'p' }, S = { ...DEF }, files = {}; let IDX, K, CELL, req = 0, cur = {}, NOW, WAS; const tbl = { tr: false, ch: false };
  const get = async (u) => { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(u + ': ' + r.status); const b = new Uint8Array(await r.arrayBuffer()); return JSON.parse(b[0] === 0x1f && b[1] === 0x8b ? await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text() : new TextDecoder().decode(b)); };
  const file = (u) => (files[u] ??= get(u).catch((e) => { delete files[u]; throw e; })), month = (m) => file(`data/dashboards/personas/${m}.json.gz`);
  const shift = (m, n) => { const [y, mo] = m.split('-').map(Number); return new Date(Date.UTC(y, mo - 1 + n, 1)).toISOString().slice(0, 7); }, qOf = (m) => { const [y, mo] = m.split('-').map(Number); return `${y}-${String(Math.floor((mo - 1) / 3) * 3 + 1).padStart(2, '0')}`; }, qName = (q) => `Q${(+q.slice(5) + 2) / 3} ${q.slice(0, 4)}`, qMonths = (q) => [0, 1, 2].map((i) => shift(q, i));
  const DIM = { p: { name: 'Persona', label: (k) => (IDX.personas.find((x) => x.id === +k) || {}).name }, s: { name: 'Segment', label: (k) => IDX.names.s[k] }, a: { name: 'Age band', label: (k) => IDX.names.a[k] }, d: { name: 'Digital enrollment', label: (k) => (+k ? 'Enrolled' : 'Not enrolled') } };
  Promise.all([file('data/dashboards/kpis.json'), file('data/dashboards/personas/index.json')]).then(([k, i]) => {
    const all = Object.fromEntries([...k.kpis, ...k.extra].map((x) => [x.id, x])); IDX = i;
    K = { rate: all.contact_rate, reach: all.reach, digital: { ...all.digital_share, better: 'none' }, csat: all.csat, nps: all.nps, fcr: all.fcr, repeat: all.repeat, complaints: { ...all.complaints, definition: 'Formal complaints opened for every 1,000 contacts from identified customers, including complaints made outside the contact center.', formula: 'Complaints ÷ identified contacts × 1,000' } };
    CELL = new Map(i.cells.map((c) => [c[0], { p: c[1], s: c[2], a: c[3], d: c[4] }])); IDX.cust = new Map(); for (const [q, c, n] of i.customers) (IDX.cust.get(q) || (IDX.cust.set(q, new Map()), IDX.cust.get(q))).set(c, n);
    IDX.rch = new Map(); for (const r of i.reach) (IDX.rch.get(r[0]) || (IDX.rch.set(r[0], []), IDX.rch.get(r[0]))).push(r);
    DEF.q = S.q = i.quarters[i.quarters.length - 1]; $('f-q').innerHTML = [...i.quarters].reverse().map((q) => `<option value="${q}">${qName(q)}</option>`).join('');
    const opt = (id, rows) => { $(id).innerHTML = '<option value="">All</option>' + rows.map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join(''); }; opt('f-p', i.personas.map((x) => [x.id, x.name])); opt('f-s', Object.entries(i.names.s)); opt('f-a', Object.entries(i.names.a));
    const p = new URLSearchParams(location.search); for (const key of ['q', 'cmp', 'p', 's', 'a', 'd', 'dim']) { const v = p.get(key); if (v && [...$('f-' + key).options].some((o) => o.value === v)) S[key] = v; } if (M.includes(p.get('metric'))) S.metric = p.get('metric');
    Site.setDataThrough(i.data_through); $('footer-generated').textContent = `Data through ${fmt.date(i.data_through)} · exported ${fmt.date(i.generated_at)}, ${fmt.time(i.generated_at)} CT · Customer & persona insights v1.0`;
    return update();
  }).catch(fail);
  function fail(e) { $('loading').hidden = false; $('loading').textContent = 'The customer data could not be loaded. ' + e.message; }
  const F = (m) => K[m].format, V = (m, v) => fmt.value(v, F(m), true), low = (m, t) => P.n(m, t) < (m === 'rate' ? 1 : K[m].minN), dt = (m, a, b) => { const c = fmt.change(a, b, F(m)); return c ? (c.flat ? '0' : c.text) : '–'; };
  // ---------- Totals ----------
  const okCell = (c, skip) => ['p', 's', 'a', 'd'].every((f) => f === skip || S[f] === '' || String(c[f]) === S[f]);

  function totals(datas, key, skip) {

    return out;
  }
  function withBase(map, key, qs, months, skip) {   // customers and reach for groups; qs: quarters, months: months each customer counts for

    return map;
  }
  function period(q, datas) { const key = () => 'all', dk = (c) => c[S.dim]; return { q, datas, all: withBase(totals(datas, key), key, [[q, 3]]).get('all') || {}, dim: withBase(totals(datas, dk, S.dim), dk, [[q, 3]], 3, S.dim) }; }
  async function update() {
    const r = ++req, last = shift(S.q, 2), tm = []; for (let i = 12; i >= 0; i--) { const m = shift(last, -i); if (IDX.months.includes(m)) tm.push(m); }
    const cq = shift(S.q, S.cmp === 'year' ? -12 : -3), has = IDX.quarters.includes(cq), [td, cd] = await Promise.all([Promise.all(tm.map(month)), has ? Promise.all(qMonths(cq).map(month)) : []]); if (r !== req) return;
    cur.tm = tm; cur.td = td; NOW = period(S.q, td.slice(-3)); WAS = has ? period(cq, cd) : null;
    $('loading').hidden = true; $('content').hidden = false; controls(); writeUrl(); renderTiles(); renderGroups(); renderTrend(); renderChannels(); renderReasons(); renderHeavy();
  }
  const go = () => { hideTip(); const k = Site.focusKey(); update().then(() => Site.restoreFocus(k, '#tiles button')).catch(fail); };
  const cmpName = () => (S.cmp === 'year' ? 'same quarter last year' : 'prior quarter'), groupName = () => (cur.chips.length ? cur.chips.map((c) => c[1]).join(', ') : 'all identified customers');
  function controls() {
    for (const k of ['q', 'cmp', 'p', 's', 'a', 'd', 'dim']) $('f-' + k).value = S[k];
    cur.chips = ['p', 's', 'a', 'd'].filter((k) => S[k] !== '').map((k) => [k, k === 'd' ? `Digital: ${DIM.d.label(S.d).toLowerCase()}` : `${DIM[k].name}: ${DIM[k].label(S[k])}`]);
    $('chips').innerHTML = cur.chips.map(([k, t]) => `<button type="button" class="chip" data-q="${k}" aria-label="Remove ${esc(t)}">${esc(t)} ×</button>`).join('');
    const n = cur.chips.length + ['q', 'cmp'].filter((k) => S[k] !== DEF[k]).length; $('phone-f').textContent = n ? `Filters (${n})` : 'Filters';
    $('s-page').textContent = `${qName(S.q)} (${fmt.monthShort(S.q)}–${fmt.monthShort(shift(S.q, 2))}) · ${NOW.all.cust ? fmt.count(NOW.all.cust) + ' customers' : 'no customers match these filters'} · ${WAS ? `compared with ${qName(WAS.q)}` : `no ${cmpName()} to compare`}`;
    const pr = S.p && IDX.personas.find((x) => x.id === +S.p); $('about').hidden = !pr; $('about').textContent = pr ? `${pr.name}: ${pr.about} Preferred channel: ${pr.channel.toLowerCase()}.` : '';
  }
  function writeUrl() { const p = new URLSearchParams(); for (const k of Object.keys(DEF)) if (S[k] !== DEF[k]) p.set(k, S[k]); history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : '')); }
  function chg(m, now, was) { if (!was || low(m, was) || low(m, now)) return null; const a = P.value(m, now), b = P.value(m, was), c = fmt.change(a, b, F(m)), real = P.beyond(m, now, was); return c && { c, real, q: real ? changeQuality(K[m], a, b, c) : 'neutral' }; }
  const arrow = (x) => (x.c.flat ? '– No change' : `${x.c.delta > 0 ? '▲' : '▼'} ${x.c.text}`);
  // ---------- Tiles ----------
  function renderTiles() {
    const host = $('tiles'); host.innerHTML = '';
    for (const m of M) { const k = K[m], t = NOW.all, v = P.value(m, t), lo = low(m, t), x = WAS && chg(m, t, WAS.all), d = document.createElement('div'); d.className = 'tile' + (S.metric === m ? ' sel' : '');
      d.innerHTML = `<div class="tile-top"><button type="button" class="t" data-k="tile-${m}" aria-pressed="${S.metric === m}">${esc(k.name)}</button></div><div class="v">${V(m, v)}</div>${k.target == null ? '' : `<span class="status ${lo ? 'none' : statusOf(k, v)}">${lo ? 'Too few' : STATUS_WORD[statusOf(k, v)]}</span>`}<div class="m">${k.target == null ? 'No target' : 'Target ' + esc(k.targetLabel)}${lo ? ` · n = ${fmt.count(P.n(m, t))}, below ${k.minN}` : ''}</div>${x ? `<span class="chg ${x.q}">${Site.changeMark(x.q, `${arrow(x)} vs ${cmpName()}`)}</span>${x.c.flat ? '' : `<div class="m">${x.real ? 'Beyond chance' : 'Within chance'}</div>`}` : ''}`;

  }
  // ---------- Groups ----------
